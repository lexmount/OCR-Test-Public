name: Temporary ACK load probe
on:
  push:
    branches:
      - 'test/ack-load-20261111-mwc6n9ve'
permissions: {}
concurrency:
  group: temporary-ocr-ack-load-probe
  cancel-in-progress: false
jobs:
  measure:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Measure network phases and ACK latency
        env:
          OCR_CI_TOKEN: ${{ secrets.OCR_CI_TOKEN }}
          PROBE_RUNNER_ENVIRONMENT: ${{ runner.environment }}
        shell: python3 {0}
        run: |
          # SPDX-License-Identifier: Apache-2.0
          import concurrent.futures
          import hashlib
          import ipaddress
          import json
          import os
          import pathlib
          import socket
          import ssl
          import statistics
          import subprocess
          import tempfile
          import time
          
          HOST = 'https://n8n.cross.lexmount.cn'
          COORDS = {'repository': 'lexmount/ocr-test-public', 'pull_number': 19,
                    'head_sha': '1a16bbbb7e765033df72fb7c8ceacdce70d6e9cc',
                    'base_sha': '01ebeab57d581e0c94b47802e9fb9bbfed937417', 'base_ref': 'main'}
          IDENTITY = 'ocr-ci-' + hashlib.sha256(json.dumps(COORDS, sort_keys=True, separators=(',', ':')).encode()).hexdigest()
          
          
          def summary(values):
              values = sorted(values)
              return {'mean': round(statistics.mean(values), 2), 'p50': values[(len(values)-1)//2],
                      'p95': values[min(len(values)-1, int(len(values)*.95))], 'max': values[-1]} if values else None
          
          
          def main():
              if os.environ.get('PROBE_RUNNER_ENVIRONMENT') != 'github-hosted' or os.environ.get('GITHUB_REPOSITORY', '').lower() != 'lexmount/ocr-test-public':
                  raise RuntimeError('An external GitHub-hosted test-repository runner is required')
              token = os.environ.get('OCR_CI_TOKEN', '').strip()
              if not token:
                  raise RuntimeError('Existing CI secret unavailable')
              addresses = {x[4][0] for x in socket.getaddrinfo('n8n.cross.lexmount.cn', 443)}
              if not all(ipaddress.ip_address(x).is_global for x in addresses):
                  raise RuntimeError('Public target required')
          
              def context_cost(_):
                  begin = time.monotonic()
                  context = ssl.create_default_context()
                  return (time.monotonic() - begin) * 1000
          
              sequential = [context_cost(i) for i in range(5)]
              begin, cpu = time.monotonic(), time.process_time()
              with concurrent.futures.ThreadPoolExecutor(max_workers=16) as pool:
                  parallel = list(pool.map(context_cost, range(32)))
              print('CLIENT_SSL_FACTORY ' + json.dumps({'cpu_count': os.cpu_count(), 'sequential_ms': summary(sequential),
                  'parallel_ms': summary(parallel), 'parallel_wall_ms': round((time.monotonic()-begin)*1000, 2),
                  'parallel_cpu_seconds': round(time.process_time()-cpu, 3)}), flush=True)
              payload = json.dumps({'schema': 'ocr-ci/v1', 'request_id': IDENTITY, **COORDS,
                  'source': {'event_name': 'ack_network_profile', 'run_id': os.environ.get('GITHUB_RUN_ID')}}).encode()
              with tempfile.TemporaryDirectory(prefix='ack-profile-') as directory:
                  root = pathlib.Path(directory)
                  body = root / 'request'
                  body.write_bytes(payload)
          
                  def request(group, sequence, deadline):
                      begin = time.monotonic()
                      control = group.endswith('control')
                      output = root / (group + str(sequence))
                      args = ['curl', '--silent', '--show-error', '--http1.1', '--connect-timeout', '4', '--max-time', '15',
                              '--output', str(output), '--write-out', '%{json}']
                      config = ''
                      if control:
                          args += [HOST + '/healthz']
                      else:
                          args += ['--request', 'POST', '--config', '-', '--data-binary', '@'+str(body), HOST + '/webhook/ocr-ci-submit']
                          config = 'header = "Content-Type: application/json"\nheader = ' + json.dumps('Authorization: Bearer '+token) + '\n'
                      p = subprocess.run(args, input=config, capture_output=True, text=True, timeout=18)
                      wall = (time.monotonic()-begin)*1000
                      try:
                          metrics = json.loads(p.stdout)
                      except Exception:
                          metrics = {}
                      try:
                          response = json.loads(output.read_text())
                      except Exception:
                          response = {}
                      times = {key: round(metrics[key]*1000, 2) for key in ['time_namelookup', 'time_connect', 'time_appconnect',
                          'time_pretransfer', 'time_posttransfer', 'time_starttransfer', 'time_total'] if isinstance(metrics.get(key), (int,float))}
                      valid = p.returncode == 0 and (control or metrics.get('http_code') == 202 and response.get('request_id') == IDENTITY and
                          response.get('durable') is True and response.get('acceptance') == 'accepted' and response.get('state') == 'complete' and response.get('job_id') == 1791879628966)
                      row = {'group': group, 'sequence': sequence, 'scheduler_lag_ms': round((begin-deadline)*1000, 2),
                          'wall_ms': round(wall, 2), 'curl_ms': times, 'status': metrics.get('http_code'), 'valid': valid,
                          'exit': p.returncode, 'client_overhead_ms': round(wall-times.get('time_total',wall), 2),
                          'http_version': metrics.get('http_version'), 'error': p.stderr[:100] if p.returncode else None}
                      print('PHASE_SAMPLE '+json.dumps(row), flush=True)
                      return row
          
                  rows = []
                  for sequence in range(3):
                      rows.append(request('baseline_ci', sequence, time.monotonic()))
                      rows.append(request('baseline_control', sequence, time.monotonic()))
                  if not all(r['valid'] for r in rows):
                      raise RuntimeError('Baseline failed; no burst sent')
                  started = time.monotonic()+.2
                  with concurrent.futures.ThreadPoolExecutor(max_workers=53) as pool:
                      futures = []
                      for sequence in range(50):
                          deadline = started+sequence/50
                          time.sleep(max(0,deadline-time.monotonic()))
                          futures.append(pool.submit(request,'burst_ci',sequence,deadline))
                          if sequence in [0,20,40]:
                              futures.append(pool.submit(request,'burst_control',sequence,deadline))
                      rows += [f.result() for f in concurrent.futures.as_completed(futures)]
                  groups = {}
                  for group in ['baseline_ci','baseline_control','burst_ci','burst_control']:
                      selected = [r for r in rows if r['group']==group]
                      groups[group] = {'n':len(selected),'valid':sum(r['valid'] for r in selected),'wall_ms':summary([r['wall_ms'] for r in selected]),
                          'client_overhead_ms':summary([r['client_overhead_ms'] for r in selected]),
                          'phases_ms':{key:summary([r['curl_ms'][key] for r in selected if key in r['curl_ms']]) for key in ['time_namelookup','time_connect','time_appconnect','time_pretransfer','time_posttransfer','time_starttransfer','time_total']}}
                  print('PHASE_SUMMARY '+json.dumps({'groups':groups,'public_addresses':sorted(addresses),'runner':os.environ.get('RUNNER_NAME'),
                      'runner_environment':os.environ['PROBE_RUNNER_ENVIRONMENT'],'replay_only':True,'ci_burst_requests':50,'target_ci_qps':50}),flush=True)
                  if not all(r['valid'] for r in rows):
                      raise RuntimeError('Some diagnostic requests did not complete successfully')
          
          
          if __name__ == '__main__':
              main()
          
